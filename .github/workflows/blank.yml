name: Sobrecarga Acumulativa - Suma en Cada Ejecucion

on:
  workflow_dispatch:

jobs:
  saturar-ano:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configurar Git Buffer Extremo
        run: |
          git config --global user.name "bustoschilatra-sudo"
          git config --global user.email "bustoschilatra@gmail.com"
          git config --global http.postBuffer 1048576000
          git config --global core.compression 9

      - name: Inyectar Commits Acumulativos
        run: |
          python3 << 'PYEOF'
          import subprocess, time, random
          from datetime import datetime, timedelta

          AUTHOR_NAME = "bustoschilatra-sudo"
          AUTHOR_EMAIL = "bustoschilatra@gmail.com"

          DIAS = 365
          COMMITS_DIA = 100

          today = datetime.now()
          # Semilla unica para que nunca genere commits duplicados
          BATCH = random.randint(100000, 999999)
          
          # Detectar el ultimo commit existente para encadenar
          res = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True)
          last_commit = res.stdout.strip() if res.returncode == 0 else None

          p = subprocess.Popen(['git', 'fast-import', '--date-format=raw'], stdin=subprocess.PIPE, text=True)

          mark = 1
          parent_sha = last_commit
          parent_mark = None

          print(f"Generando lote acumulativo #{BATCH} de {DIAS * COMMITS_DIA} commits...")

          for d in range(DIAS, 0, -1):
              target_date = today - timedelta(days=d)
              epoch = int(time.mktime(target_date.timetuple()))
              tz = "+0000"

              for c in range(COMMITS_DIA):
                  commit_time = epoch + (c * 300)
                  
                  stream = f"commit refs/heads/main\n"
                  stream += f"mark :{mark}\n"
                  stream += f"author {AUTHOR_NAME} <{AUTHOR_EMAIL}> {commit_time} {tz}\n"
                  stream += f"committer {AUTHOR_NAME} <{AUTHOR_EMAIL}> {commit_time} {tz}\n"
                  stream += f"data 18\nfeat: batch boost\n"
                  
                  if parent_mark is not None:
                      stream += f"from :{parent_mark}\n"
                  elif parent_sha:
                      stream += f"from {parent_sha}\n"
                  
                  file_content = f"batch-{BATCH}-{d}-{c}\n"
                  stream += f"M 644 inline data.txt\n"
                  stream += f"data {len(file_content)}\n{file_content}\n"

                  p.stdin.write(stream)
                  parent_mark = mark
                  mark += 1

              if d % 50 == 0:
                  print(f"Faltan {d} días... ({mark - 1} commits listos)")

          p.stdin.close()
          p.wait()
          print("Lote generado con éxito.")
          PYEOF

      - name: Push Acumulativo a GitHub
        run: |
          git checkout main || git checkout -B main refs/heads/main
          git push origin main
