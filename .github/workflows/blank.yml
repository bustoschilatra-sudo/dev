name: Sobrecarga Real - Fechas Garantizadas

on:
  workflow_dispatch:

jobs:
  saturar-ano:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configurar Git Buffer
        run: |
          git config --global user.name "bustoschilatra-sudo"
          git config --global user.email "bustoschilatra@gmail.com"
          git config --global http.postBuffer 1048576000

      - name: Inyectar Fechas Pasadas Garantizadas
        run: |
          python3 << 'PYEOF'
          import subprocess, time
          from datetime import datetime, timedelta

          AUTHOR_NAME = "bustoschilatra-sudo"
          AUTHOR_EMAIL = "bustoschilatra@gmail.com"

          DIAS = 365
          # 50 commits por dia = 18,250 commits perfectamente fechados
          COMMITS_DIA = 50

          today = datetime.now()
          
          # fast-import con formato de fecha RFC2822 para que GitHub nunca lo ignore
          p = subprocess.Popen(['git', 'fast-import', '--date-format=rfc2822'], stdin=subprocess.PIPE, text=True)

          mark = 1
          parent_mark = None

          print(f"Generando {DIAS * COMMITS_DIA} commits con fechas históricas reales...")

          for d in range(DIAS, 0, -1):
              # Fecha exacta en el pasado
              day_base = today - timedelta(days=d)
              
              for c in range(COMMITS_DIA):
                  # Repartir los commits en minutos dentro del mismo dia (entre 08:00 y 20:00)
                  minutos = int((c / COMMITS_DIA) * 720) # 720 mins = 12 horas
                  commit_dt = day_base.replace(hour=8, minute=0, second=0) + timedelta(minutes=minutos)
                  
                  # Formato estricto RFC2822: "Mon, 20 Nov 2025 14:30:00 +0000"
                  date_str = commit_dt.strftime("%a, %d %b %Y %H:%M:%S +0000")
                  
                  stream = f"commit refs/heads/main\n"
                  stream += f"mark :{mark}\n"
                  stream += f"author {AUTHOR_NAME} <{AUTHOR_EMAIL}> {date_str}\n"
                  stream += f"committer {AUTHOR_NAME} <{AUTHOR_EMAIL}> {date_str}\n"
                  stream += f"data 14\nfeat: activity\n"
                  
                  if parent_mark is not None:
                      stream += f"from :{parent_mark}\n"
                  
                  file_content = f"{d}-{c}\n"
                  stream += f"M 644 inline data.txt\n"
                  stream += f"data {len(file_content)}\n{file_content}\n"

                  p.stdin.write(stream)
                  parent_mark = mark
                  mark += 1

              if d % 50 == 0:
                  print(f"Faltan {d} días...")

          p.stdin.close()
          p.wait()
          print("Listo.")
          PYEOF

      - name: Push a GitHub
        run: |
          git checkout -B main refs/heads/main
          git push --force origin main
